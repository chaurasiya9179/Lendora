version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lendora-postgres
    restart: always
    environment:
      POSTGRES_DB: lendora_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: lendora-api
    restart: always
    environment:
      PORT: 5000
      JWT_SECRET: lendora-production-super-secret-key-2026-financial-grade
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/lendora_db
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: lendora-web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
